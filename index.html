<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenshotLabels</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <div class="mark-cell c1"></div>
          <div class="mark-cell c2"></div>
          <div class="mark-cell c3"></div>
          <div class="mark-cell c4"></div>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="sampleBtn">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18M9 21V9" />
          </svg>
          Add Samples
        </button>
        <button class="btn btn-hero" id="createQuadrantImgBtn">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
          Generate Screenshot
        </button>
        <button class="btn btn-danger" id="clearAllBtn">Clear All</button>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none" />
      </div>
    </header>

    <main class="workspace-layout">
      <section class="matrix-grid">
        <article class="matrix-cell cell-q1" data-zone-id="square-1">
          <header class="cell-header">
            <div class="cell-identity">
              <span class="coord-badge">1</span>
              <div class="editable-label" contenteditable="true" spellcheck="false" id="title-sq-1">
                Priority Issues
              </div>
            </div>
          </header>
          <div class="cell-body"></div>
        </article>

        <article class="matrix-cell cell-q2" data-zone-id="square-2">
          <header class="cell-header">
            <div class="cell-identity">
              <span class="coord-badge">2</span>
              <div class="editable-label" contenteditable="true" spellcheck="false" id="title-sq-2">
                Design References
              </div>
            </div>
          </header>
          <div class="cell-body"></div>
        </article>

        <article class="matrix-cell cell-q3" data-zone-id="square-3">
          <header class="cell-header">
            <div class="cell-identity">
              <span class="coord-badge">3</span>
              <div class="editable-label" contenteditable="true" spellcheck="false" id="title-sq-3">
                Typography &amp; UI Polish
              </div>
            </div>
          </header>
          <div class="cell-body"></div>
        </article>

        <article class="matrix-cell cell-q4" data-zone-id="square-4">
          <header class="cell-header">
            <div class="cell-identity">
              <span class="coord-badge">4</span>
              <div class="editable-label" contenteditable="true" spellcheck="false" id="title-sq-4">
                Accepted &amp; Archived
              </div>
            </div>
          </header>
          <div class="cell-body"></div>
        </article>
      </section>

      <aside class="dock-panel" data-zone-id="tray">
        <div class="dock-header">
          <div class="dock-title-row">
            <span class="dock-title">Staging</span>
          </div>
          <div class="drop-intake-box" id="dropzoneBox" role="button" tabindex="0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <p class="drop-intake-text"><span>Browse files</span> or drop here</p>
          </div>
        </div>
        <div class="dock-items-area" id="trayList"></div>
      </aside>
    </main>

    <!-- Lightbox -->
    <div class="overlay-backdrop" id="imageModal" role="dialog" aria-modal="true">
      <div class="lightbox-frame">
        <button class="overlay-close-btn" id="modalClose">&times;</button>
        <img id="modalImg" src="" alt="Expanded preview" />
        <div class="lightbox-caption" id="modalCaption"></div>
      </div>
    </div>

    <!-- Proof Sheet Modal -->
    <div class="overlay-backdrop" id="compositeModal" role="dialog" aria-modal="true">
      <div class="composite-dialog">
        <header class="composite-dialog-header">
          <div class="composite-dialog-title">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
            <span>Preview</span>
          </div>
          <div class="composite-dialog-actions">
            <button class="btn btn-hero" id="downloadCompositeBtn">Download PNG</button>
            <button class="btn" id="copyCompositeBtn">Copy Image</button>
            <button class="btn" id="closeCompositeBtn">Close</button>
          </div>
        </header>
        <div class="composite-canvas-scroll">
          <img id="compositeResultImg" src="" alt="Generated Proof Sheet" />
        </div>
      </div>
    </div>

    <div id="globalDropOverlay">
      <div class="drop-banner">Drop to ingest screenshot into ProofSheet</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
